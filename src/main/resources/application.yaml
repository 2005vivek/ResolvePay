server:
  port: 8085

spring:
  application:
    name: resolvepay-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resolvepay}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: false

  ai:
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        max-interval: 1500ms
        multiplier: 1.5
    google:
      genai:
        api-key: ${GEMINI_API_KEY:mock-gemini-key}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
            max-output-tokens: 800
            temperature: 0.7

paypal:
  client-id: ${PAYPAL_CLIENT_ID:mock-client-id}
  client-secret: ${PAYPAL_CLIENT_SECRET:mock-client-secret}
  webhook-id: ${PAYPAL_WEBHOOK_ID:}
  mode: sandbox

resolvepay:
  security:
    auth-token: ${RESOLVEPAY_AUTH_TOKEN:rzp_live_sec_789f2a4b8c1d}
    default-merchant-id: ${DEFAULT_MERCHANT_ID:merchant_resolvepay_01}
  cors:
    allowed-origins: ${RESOLVEPAY_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  simulation:
    enabled: ${RESOLVEPAY_SIMULATION_ENABLED:true}

